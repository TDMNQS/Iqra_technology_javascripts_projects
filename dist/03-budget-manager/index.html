<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget Management</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container"><h1>Budget Management</h1><div class="row">
<section class="col-6"><form id="budgetForm">
<div class="form-row"><label for="subject">Subject :</label><input id="subject" required></div><div class="form-row"><label for="budget">Budget :</label><select id="budget" required><option value="">select budget</option><option value="microsoft">microsoft 365 license</option><option value="hardware">Hardware Update</option><option value="offshore">Offshore support</option></select></div>
<div class="form-row"><label for="budgetAmount">Budget Amount :</label><input id="budgetAmount" readonly></div><div class="form-row"><label for="remaining">Remaining Budget :</label><input id="remaining" readonly></div>
<div class="form-row"><label for="amount">Amount :</label><input id="amount" type="number" min="0" required></div><div class="form-row"><label for="balance">Balance :</label><input id="balance" readonly></div>
<button class="btn success" id="submitBtn" type="submit">Submit</button><p id="status" class="status" role="status"></p></form></section>
<section class="col-6"><h2>Budget Records (<span id="count">0</span>)</h2><div class="table-wrap"><table><thead><tr><th>Subject</th><th>Budget</th><th>Amount</th><th>Balance</th><th>Action</th></tr></thead><tbody id="budgetBody"></tbody></table></div></section>
</div></main><script src="./script.js"></script></body></html>
