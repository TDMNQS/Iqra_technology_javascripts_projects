<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Records</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container"><h1 class="project-title">Employee Records</h1>
<form id="employeeForm"><div class="row"><div class="col-6 form-row"><label for="name">Name</label><input id="name" required></div><div class="col-6 form-row"><label for="age">Age</label><input id="age" type="number" min="16" max="100" required></div><div class="col-6 form-row"><label for="email">Email</label><input id="email" type="email" required></div><div class="col-6 form-row"><label for="department">Department</label><input id="department" required></div></div>
<button class="btn btn-success" id="saveEmployee" type="submit">Add Employee</button><button class="btn btn-secondary hidden" id="cancelEdit" type="button">Cancel</button><p id="status" class="status"></p></form>
<div class="form-row"><label for="search">Search Employee</label><input id="search" placeholder="Search by name, age, email or department"></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Age</th><th>Email</th><th>Department</th><th>Action</th></tr></thead><tbody id="employeeBody"></tbody></table></div><p class="muted" id="emptyState">No employee records.</p>
</main><script src="./script.js"></script></body></html>
