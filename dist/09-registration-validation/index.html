<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Form</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container narrow"><h1 class="project-title">Registration Form</h1>
<form id="registrationForm" novalidate>
<div class="form-row"><label for="fullName">Full Name</label><input id="fullName"><small class="error" id="fullNameError"></small></div>
<div class="form-row"><label for="password">Password</label><input id="password" type="password"><small class="error" id="passwordError"></small></div>
<div class="form-row"><label for="phoneNumber">Phone Number</label><input id="phoneNumber" inputmode="numeric"><small class="error" id="phoneNumberError"></small></div>
<div class="form-row"><label for="email">Email</label><input id="email" type="email"><small class="error" id="emailError"></small></div>
<div class="form-row"><label for="country">Country</label><select id="country"><option value="">Select Country</option><option>Pakistan</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Canada</option><option>Australia</option><option>United Arab Emirates</option><option>Saudi Arabia</option></select><small class="error" id="countryError"></small></div>
<div class="form-row"><label for="currency">Currency</label><input id="currency" readonly></div>
<button class="btn btn-success" type="submit">Submit</button><p id="status" class="status" role="status"></p>
</form></main><script src="./script.js"></script></body></html>
