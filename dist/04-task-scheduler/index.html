<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Scheduler</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container narrow"><h1 class="project-title">Task Scheduler</h1>
<form id="taskForm"><div class="form-row"><label for="taskName">Task Name</label><input id="taskName" required></div><div class="form-row"><label for="dueDate">Due Date</label><input id="dueDate" type="date" required></div>
<div class="form-row"><label for="priority">Priority</label><select id="priority" required><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
<button class="btn btn-success" id="saveTask" type="submit">Add Task</button><button class="btn btn-secondary hidden" id="cancelEdit" type="button">Cancel</button></form>
<ul class="task-list" id="taskList"></ul><p class="muted" id="emptyState">No tasks added.</p></main><script src="./script.js"></script></body></html>
