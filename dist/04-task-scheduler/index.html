<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Task scheduler with due dates, priorities, editing, and completion status.">
  <title>Task Scheduler | JavaScript Project 04</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="../"><span class="brand-mark">04</span><span>Task Scheduler<small>JavaScript Project</small></span></a><a class="header-link" href="../">← All projects</a></header>
  <main class="page app-shell">
    <section class="app-heading"><div><div class="eyebrow">Daily Focus</div><h1>Schedule what matters</h1><p>Add tasks, assign priorities, and keep every due date visible.</p></div></section>
    <section class="grid-2">
      <form class="panel" id="taskForm">
        <div class="panel-title"><h2 id="taskFormTitle">Add task</h2></div>
        <div class="form-grid">
          <div class="field full"><label for="taskName">Task name</label><input id="taskName" required maxlength="80" placeholder="e.g. Complete JavaScript project"></div>
          <div class="field"><label for="dueDate">Due date</label><input id="dueDate" type="date" required></div>
          <div class="field"><label for="priority">Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
        </div>
        <div class="actions"><button class="btn" type="submit" id="taskSave">Add task</button><button class="btn secondary hidden" type="button" id="taskCancel">Cancel edit</button></div>
      </form>
      <div class="panel metrics">
        <div class="metric"><span>Total tasks</span><strong id="totalTasks">0</strong></div>
        <div class="metric"><span>Completed</span><strong id="completedTasks">0</strong></div>
        <div class="metric"><span>Due soon</span><strong id="dueSoonTasks">0</strong></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>Schedule</h2><select id="taskFilter" aria-label="Filter tasks" style="max-width:180px"><option value="all">All tasks</option><option value="open">Open</option><option value="completed">Completed</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>Status</th><th>Task</th><th>Due date</th><th>Priority</th><th>Actions</th></tr></thead><tbody id="taskRows"></tbody></table></div>
    </section>
  </main>
  <footer class="footer">Project 04 of 09 · Numan Qureshi</footer>
  <script src="./script.js"></script>
</body>
</html>
