<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container medium"><h1 class="project-title">Expense Tracker</h1>
<form id="expenseForm"><div class="row"><div class="col-6 form-row"><label for="amount">Amount</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="col-6 form-row"><label for="category">Category</label><input id="category" required></div></div>
<div class="form-row"><label for="description">Description</label><input id="description" required></div><button class="btn btn-success" id="saveExpense" type="submit">Add Expense</button><button class="btn btn-secondary hidden" id="cancelEdit" type="button">Cancel</button></form>
<div class="table-wrap"><table><thead><tr><th>Amount</th><th>Category</th><th>Description</th><th>Action</th></tr></thead><tbody id="expenseBody"></tbody></table></div>
<div class="summary"><strong>Total Expenses: $<span id="totalExpenses">0.00</span></strong></div></main><script src="./script.js"></script></body></html>
