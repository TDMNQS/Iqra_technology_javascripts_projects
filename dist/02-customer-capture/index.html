<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Project</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container"><div class="row">
<section class="col-4"><h1>Form</h1><form id="customerForm">
<div class="form-row"><label for="name">Name</label><input id="name" required></div><div class="form-row"><label for="email">Email</label><input id="email" type="email" required></div>
<div class="form-row"><label for="customerType">Customer Type</label><select id="customerType" required><option value="">Select</option><option value="existing">Existing</option><option value="new">New</option></select></div>
<div class="form-row hidden" id="amountRow"><label for="amount">Amount</label><input id="amount" type="number" min="0" step="1"></div>
<button class="btn success" type="submit">Submit</button><p id="status" class="status" role="status"></p></form></section>
<section class="col-4"><h1>Existing Customers</h1><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Amount</th><th>Action</th></tr></thead><tbody id="existingBody"></tbody></table></div></section>
<section class="col-4"><h1>New Customers</h1><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Action</th></tr></thead><tbody id="newBody"></tbody></table></div></section>
</div></main><script src="./script.js"></script></body></html>
