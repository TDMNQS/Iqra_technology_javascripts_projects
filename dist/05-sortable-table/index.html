<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sortable and Filterable Table</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container medium"><h1 class="project-title">Sortable and Filterable Table</h1>
