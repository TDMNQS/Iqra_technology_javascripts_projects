<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP Project</title><link rel="stylesheet" href="../shared/assignment.css"></head><body>
<a class="top-link" href="../">← All projects</a><main class="container narrow"><h1>OTP Project</h1>
<div class="form-row"><label for="otp">OTP:</label><input id="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="Enter 4-digit OTP"></div>
<div class="actions"><button class="btn" id="getOtpBtn" type="button">Get Otp</button><button class="btn success" id="checkOtpBtn" type="button">Check Otp</button></div>
<h2 id="display" class="timer">0 : 0</h2><p id="timer" class="muted">Generate an OTP to start the 2-minute timer.</p><p id="status" class="status" role="status" aria-live="polite"></p>
</main><script src="./script.js"></script></body></html>
